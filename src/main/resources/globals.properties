# =========================================================
# 외부 공공 API 연동 (External API Adapter)
# =========================================================

# --- 공통 HTTP 타임아웃 (ms) ---
external.api.timeout.connect-millis=10000
external.api.timeout.read-millis=10000

# --- 공통 재시도 ---
# max-attempts: 최초 호출 제외 추가 재시도 횟수, backoff-millis: 지수 백오프 기준값(2^(n-1)배)
external.api.retry.max-attempts=2
external.api.retry.backoff-millis=500

# --- 공공데이터포털 (data.go.kr) ---
# 운영서버와 개발서버는 base-url / service-key 만 교체하여 사용
external.api.publicdata.base-url=https://apis.data.go.kr
# 실제 키로 교체 (환경변수 EXTERNAL_API_PUBLICDATA_SERVICE_KEY 로 주입 권장)
external.api.publicdata.service-key=REPLACE_WITH_SERVICE_KEY
# Encoding 키=true(재인코딩 안 함) / Decoding 키=false
external.api.publicdata.service-key-encoded=true

# --- 기상청 단기예보 (data.go.kr / VilageFcstInfoService_2.0) ---
external.api.weather.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
# 인증키는 환경변수 WEATHER_API_KEY 로만 주입 (코드/Git 미포함). 미설정 시 빈 값 -> 호출 시 실패
external.api.weather.service-key=${WEATHER_API_KEY:}
# Encoding 키=true(재인코딩 안 함) / Decoding 키=false
external.api.weather.service-key-encoded=true

# --- 날씨 기본 좌표 (디바이스 좌표 조회 실패 시 fallback) ---
# 광주광역시청 기준
weather.location.default.lat=35.1595
weather.location.default.lng=126.8526