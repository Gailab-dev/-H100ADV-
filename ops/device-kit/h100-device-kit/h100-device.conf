# =============================================================================
#  H100 엣지(Jetson) 설치·패치 키트 — 공통 설정 파일   (비밀값 없음)
#
#  ★ 경로·이름을 바꿔야 할 때는 이 파일만 수정합니다. (스크립트 본문은 수정하지 않습니다)
#  ★ 수정 후에는 반드시 각 스크립트의 `check` 를 다시 실행해 통과를 확인하세요.
#  ★ 이 파일을 바꾸면 MANUAL.md 의 "경로 계약표"도 같이 고치고, 서버 담당자(효성)에게 알려주세요.
#
#  기준 문서: G.Eye.Parking H100 엣지 저장경로 안내 (2026-10-28, 조석빈)
#     - 기준: 엣지 Jetson, 코드 폴더 ~/H100/system
#     - 기존 recorded 폴더는 output 으로 이름 변경 (하위 구조 동일)
# =============================================================================

# -----------------------------------------------------------------------------
# [A] 기준 폴더  ←←← 경로가 바뀌면 여기부터 수정
# -----------------------------------------------------------------------------
# 엣지의 H100 최상위 폴더 (안내서의 ~/H100 에 해당). 절대경로로 씁니다.
H100_HOME="/home/gailab/H100"

# 코드 폴더 (안내서의 ~/H100/system). Python 코드와 rois.json 이 있는 곳.
SYSTEM_DIR="$H100_HOME/system"

# 산출물 폴더 (안내서의 ~/H100/output; 예전 이름은 recorded).
# module_d 의 .env 에서 FILE_PATH 로 들어갑니다.
OUTPUT_DIR="$H100_HOME/output"

# -----------------------------------------------------------------------------
# [B] 파일 저장 폴더  ←←← 안내서 §1 (이미지/영상/음성)
# -----------------------------------------------------------------------------
# ※ 주의: 이미지·영상 폴더 이름은 module_d 소스(fileSend.go)에 "image", "video" 로 고정되어 있습니다.
#    OUTPUT_DIR 아래의 이 두 이름을 바꾸면 module_d 소스를 수정·재빌드해야 하므로 여기서는 바꾸지 않습니다.
IMAGE_DIR="$OUTPUT_DIR/image"                # 위반 이벤트 이미지
VIDEO_DIR="$OUTPUT_DIR/video"                # 위반 이벤트 영상
VIDEO_ALWAYS_DIR="$VIDEO_DIR/always"         # 상시 녹화 영상 (Python 이 사용, module_d 는 전송하지 않음)

# 음성(SIP 통화 녹음) 폴더. module_d 의 AUDIO_PATH 로 들어갑니다. (이 폴더는 이름을 바꿔도 됩니다)
VOICE_DIR="$OUTPUT_DIR/voice"

# -----------------------------------------------------------------------------
# [C] ROI  ←←← 안내서 §2, §3
# -----------------------------------------------------------------------------
# rois.json (코드 폴더 바로 안). module_d 의 ROI_FILE_PATH 로 들어갑니다.
ROIS_JSON="$SYSTEM_DIR/rois.json"

# ROI 그리기용 스냅샷 이미지 폴더. module_d 의 ROI_SNAPSHOT_DIR 로 들어갑니다.
# ※ module_d 는 이 폴더에서 "<카메라명>.jpg" (JPEG) 파일을 읽습니다. 파일명 규칙은 디바이스 담당자와 확인 필요.
#   (스냅샷을 URL 로 주는 방식을 쓸 경우: 아래 ROI_SNAPSHOT_URL 에 주소를 쓰면 폴더보다 우선합니다)
ROI_SNAPSHOT_DIR="$OUTPUT_DIR/roi_snapshot"
ROI_SNAPSHOT_URL=""

# -----------------------------------------------------------------------------
# [D] module_d 설치 위치 · 서비스
# -----------------------------------------------------------------------------
# module_d 가 실행되는 폴더 (바이너리, .env, ssl/, logs/, hls/ 가 있는 곳)
MODULE_D_DIR="$SYSTEM_DIR/h100_module_d"
BIN_NAME="h100_module_d"                     # 바이너리 파일명
SERVICE_NAME="h100_module_d"                 # systemd 서비스 이름
SERVICE_USER="gailab"                        # 서비스를 실행하는 계정
SERVICE_GROUP="gailab"

# module_d 가 여는 HTTPS 포트와 HLS 폴더
PORT="8087"
HLS_DIR="$MODULE_D_DIR/hls"

# -----------------------------------------------------------------------------
# [E] 서버(module_c) 주소  ←←← 서버 이전/전환 시 수정 (설치 때만 .env 에 기록됨)
# -----------------------------------------------------------------------------
# 반드시 "IP:포트" 형식 (포트 8189 포함!).  예) 192.168.0.115:8189
# 패치 스크립트(2번·3번)는 이 값을 .env 에 쓰지 않습니다 (현재 .env 값 유지).
CLOUD_RECEIVE_IP=""

# -----------------------------------------------------------------------------
# [F] 인증서(TLS) 파일 이름·위치
# -----------------------------------------------------------------------------
SSL_DIR="$MODULE_D_DIR/ssl"
CA_CERT_NAME="h100-ca.crt"                   # 내부 CA 인증서 (공개 인증서)
# 장비 시리얼. 비워두면 /proc/device-tree/serial-number 에서 자동으로 읽습니다.
DEVICE_SERIAL=""
# 장비 인증서/개인키 파일명은 device-<시리얼>.crt / .key 로 만들어집니다.

# CA 인증서 지문(SHA256) 고정값. 채워 두면 CA 가 다른 파일로 바뀌는 사고를 막습니다.
# 확인법: openssl x509 -in h100-ca.crt -noout -fingerprint -sha256   (콜론 포함 형식 그대로)
# 비워두면 지문을 화면에 보여주기만 하고 비교하지 않습니다.
CA_FINGERPRINT_SHA256=""

# 인증서 남은 유효기간 경고 기준(일)
CERT_MIN_DAYS="30"

# -----------------------------------------------------------------------------
# [G] 기타 .env 기본값 (최초 설치 때만 사용)
# -----------------------------------------------------------------------------
FILE_SEND_SCH_TIME="0 30 3 * * *"            # 초 분 시 일 월 요일 (6칸). 전날 파일 일괄 전송 시각
SEGMENT_TIME="3"
FFMPEG_PATH="ffmpeg"

# systemd 서비스 파일 위치 (보통 수정하지 않음)
SYSTEMD_DIR="/etc/systemd/system"

# -----------------------------------------------------------------------------
# [H] 키트 동작 위치 (보통 수정하지 않음)
# -----------------------------------------------------------------------------
# 백업 · 작업 기록 · 인증서 기준 해시가 저장되는 곳 (개인키 사본이 들어가므로 권한 700)
KIT_STATE_DIR="$HOME/.h100-device"
BACKUP_DIR="$KIT_STATE_DIR/backup"
LOG_DIR="$KIT_STATE_DIR/logs"
KEEP_BACKUPS="5"                             # 백업은 최신 N개만 보관
# 인증서 기준 해시 목록 (예전에 저장해 둔 ~/module_d_ssl.sha256 과 같은 형식·같은 이름)
SSL_BASELINE="$HOME/module_d_ssl.sha256"

# 패치 파일(바이너리·인증서)을 넣어 두는 폴더 (키트 폴더 안의 payload/). 보통 수정하지 않음.
# PAYLOAD_DIR="..."   # 기본값: 키트 폴더/payload
