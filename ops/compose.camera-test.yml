# Synthetic RTSP source for local automated verification only. No physical camera.
services:
  rtsp-source:
    image: bluenviron/mediamtx:1
    restart: unless-stopped
  camera-publisher:
    image: h100-module-d:local
    entrypoint: [ffmpeg]
    command: [-hide_banner, -loglevel, error, -re, -f, lavfi, -i, "testsrc2=size=640x360:rate=10", -c:v, libx264, -preset, ultrafast, -tune, zerolatency, -g, "10", -f, rtsp, -rtsp_transport, tcp, "rtsp://rtsp-source:8554/test"]
    healthcheck: {disable: true}
    depends_on: [rtsp-source]
    restart: unless-stopped
  module-d:
    environment:
      RTSP_URL: rtsp://rtsp-source:8554/test
