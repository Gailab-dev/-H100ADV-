# Container-only configuration. Values are supplied at runtime.
crypto.password.algorithm=SHA-256
crypto.hashed.password=${H100_CRYPTO_HASH}
crypto.video.base64-key=${H100_VIDEO_KEY}
external.crypto.aes-key=${H100_AES_KEY}
image.enc.path=/app/H100_system/output_images_enc
video.enc.path=/app/H100_system/output_videos_enc
image.dec.path=/app/H100_system/output_images
video.dec.path=/app/H100_system/output_videos
audio.enc.path=/app/H100_system/output_audios_enc
audio.dec.path=/app/H100_system/output_audios
LogFilePath=/usr/local/tomcat/logs
mail.host=${H100_MAIL_HOST:localhost}
mail.port=587
mail.username=${H100_MAIL_USER:}
mail.password=${H100_MAIL_PASSWORD:}
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.starttls.required=true
mail.smtp.ssl.protocols=TLSv1.2
external.api.publicdata.base-url=https://apis.data.go.kr
external.api.publicdata.service-key=${H100_PUBLICDATA_KEY:}
external.api.publicdata.service-key-encoded=true
external.api.weather.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
external.api.weather.service-key=${H100_WEATHER_KEY:}
external.api.weather.service-key-encoded=true
weather.location.default.lat=35.1595
weather.location.default.lng=126.8526
kakao.map.js-key=${KAKAO_MAP_JS_KEY:}
external.api.kakao.base-url=https://dapi.kakao.com
external.api.kakao.rest-key=${KAKAO_REST_KEY:}
external.api.kakao.rest-key-encoded=false

# =========================================================
# Web ROI setting (plan 34) - Java -> module_c relay
# =========================================================
# module_c base URL (HTTPS, internal CA must be trusted by the JVM). Empty -> ROI feature answers 503 NOT_CONFIGURED.
roi.modulec.base-url=${H100_MODULE_C_URL:}
# Bearer token shared with module_c (env H100_ROI_TOKEN on both sides). Never commit a real value.
roi.modulec.token=${H100_ROI_TOKEN:}
# Timeouts (ms): Java->module_c 13s (module_c->module_d 12s, browser popup 15s)
roi.modulec.connect-timeout-ms=5000
roi.modulec.read-timeout-ms=13000
# Shared media base folder (must equal module_c FILE_UPLOAD_PATH). Empty -> parent folder of image.dec.path.
roi.media.base=${H100_ROI_MEDIA_BASE:}
# true: write the shape name into the device ROI file; false: keep names only in tbl_roi_history.rh_meta_json
# (use false if the device parser cannot ignore unknown keys - plan 34 section 11.1 item 4)
roi.file.include-name=true
